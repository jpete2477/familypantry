services:
  api:
    build:
      context: ./api
      target: dev
    ports:
      - "${FAMILYPANTRY_API_PORT:-8010}:8000"
    volumes:
      - ./api/app:/usr/src/api/app
    env_file:
      - ./api/.env
    environment:
      - CORS_ORIGIN=http://localhost:${FAMILYPANTRY_FE_PORT:-5173}
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  frontend:
    build:
      context: ./fe
      dockerfile: Dockerfile.dev
    ports:
      - "${FAMILYPANTRY_FE_PORT:-5173}:5173"
    volumes:
      - ./fe:/app
      # Anonymous volume shadows the bind mount's node_modules with the one
      # installed in the image at build time. Always go through `make dev`
      # (not a host-side `pnpm install`) so these don't drift out of sync.
      - /app/node_modules
    environment:
      VITE_API_BASE_URL: "http://localhost:${FAMILYPANTRY_API_PORT:-8010}"
    depends_on:
      api:
        condition: service_healthy
